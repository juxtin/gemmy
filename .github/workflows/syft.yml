name: Syft detection of dependencies
on:
  push:
    branches:
      - main
jobs:
  syft-detection:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v3
      - uses: anchore/sbom-action@v0
        with:
          path: .
          dependency-snapshot: true
      - uses: advanced-security/component-detection-dependency-submission-action@juxtin/ghes-fix
        name: 'Component Detection'
      - name: Submit PURLs
        uses: hmaurer/purls-submission-action@main
        with:
          purls: |-
            pkg:npm/printer@0.0.3
            
