name: Test setup-dotnet offline reuse

on:
  workflow_dispatch:

jobs:
  offline-local-sdk-reuse:
    runs-on: [self-hosted]
    timeout-minutes: 10

    steps:
      - name: Locate existing .NET installation
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner PATH: $PATH"

          DOTNET_COMMAND="$(command -v dotnet || true)"

          if [[ -z "$DOTNET_COMMAND" ]]; then
            for candidate in \
              /usr/local/share/dotnet/dotnet \
              /usr/local/bin/dotnet \
              /opt/homebrew/bin/dotnet \
              "$HOME/.dotnet/dotnet"
            do
              if [[ -x "$candidate" ]]; then
                DOTNET_COMMAND="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$DOTNET_COMMAND" ]]; then
            echo "::error::Could not find dotnet on PATH or in the standard macOS locations"
            exit 1
          fi

          DOTNET_EXECUTABLE="$(
            python3 -c \
              'import os, sys; print(os.path.realpath(sys.argv[1]))' \
              "$DOTNET_COMMAND"
          )"
          DOTNET_DIRECTORY="$(dirname "$DOTNET_EXECUTABLE")"

          echo "dotnet command:      $DOTNET_COMMAND"
          echo "resolved executable: $DOTNET_EXECUTABLE"
          echo "DOTNET_INSTALL_DIR:  $DOTNET_DIRECTORY"

          if [[ ! -x "$DOTNET_DIRECTORY/dotnet" ]]; then
            echo "::error::$DOTNET_DIRECTORY/dotnet is not executable"
            exit 1
          fi

          if [[ ! -d "$DOTNET_DIRECTORY/sdk" ]]; then
            echo "::error::$DOTNET_DIRECTORY/sdk does not exist"
            exit 1
          fi

          shopt -s nullglob
          installed_sdks=("$DOTNET_DIRECTORY"/sdk/*)

          echo "Installed SDKs:"
          for sdk in "${installed_sdks[@]}"; do
            [[ -d "$sdk" ]] && basename "$sdk"
          done

          matching_sdks=("$DOTNET_DIRECTORY"/sdk/8.0.*)
          if [[ ${#matching_sdks[@]} -eq 0 ]]; then
            echo "::error::No 8.0 SDK exists under $DOTNET_DIRECTORY/sdk"
            exit 1
          fi

          echo "DOTNET_INSTALL_DIR=$DOTNET_DIRECTORY" >> "$GITHUB_ENV"
          echo "$DOTNET_DIRECTORY" >> "$GITHUB_PATH"

      - name: Confirm blocked endpoints
        shell: bash
        run: |
          set -euo pipefail

          echo "Blocked .NET endpoints:"
          grep -E \
            'builds\.dotnet\.microsoft\.com|ci\.dot\.net|dotnetcli\.azureedge\.net' \
            /etc/hosts

      - name: Show SDKs visible before setup-dotnet
        shell: bash
        run: |
          set -euo pipefail

          echo "DOTNET_INSTALL_DIR: $DOTNET_INSTALL_DIR"
          echo "dotnet executable: $(command -v dotnet)"
          dotnet --info
          dotnet --list-sdks

      - name: Reuse installed 8.0 SDK without network access
        id: setup
        uses: actions/setup-dotnet@b2658b49ae6334ebe110c5bdca7cc25fda50c01b
        with:
          dotnet-version: '8.0.x'
          check-latest: false

      - name: Verify selected SDK
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.setup.outputs.dotnet-version }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$(dotnet --version)"

          echo "Action output:       $RESOLVED_VERSION"
          echo "dotnet version:      $ACTUAL_VERSION"
          echo "DOTNET_ROOT:         ${DOTNET_ROOT:-<unset>}"
          echo "DOTNET_INSTALL_DIR:  $DOTNET_INSTALL_DIR"

          if [[ "$RESOLVED_VERSION" != 8.0.* ]]; then
            echo "::error::Expected setup-dotnet to resolve an 8.0 SDK, got '$RESOLVED_VERSION'"
            exit 1
          fi

          if [[ "$ACTUAL_VERSION" != "$RESOLVED_VERSION" ]]; then
            echo "::error::dotnet selected '$ACTUAL_VERSION', but setup-dotnet reported '$RESOLVED_VERSION'"
            exit 1
          fi

          echo "SUCCESS: setup-dotnet reused the locally installed SDK while its download endpoints were blocked."
